name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image (the deploy script builds the same Dockerfile for arm64)
        run: docker build -t firstshot .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8080 --name firstshot firstshot
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/match -H 'content-type: application/json' \
            -d '{"target": {"kind": "patch", "value": "orange"}}' > /dev/null
          docker logs firstshot
